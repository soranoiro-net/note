<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#006e54">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>栽培ノート</title>
<style>
:root{--g:#006e54;--gt:#006e54;--g2:#e2f0eb;--ink:#1f2a22;--mut:#667066;--line:#d9e0d9;--bg:#f6f8f5;--warn:#b25a00;--warnbg:#fff4e2;--red:#b3261e}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Noto Sans JP",Meiryo,sans-serif;color:var(--ink);background:var(--bg);font-size:16px;line-height:1.5;padding-bottom:76px}
header{background:var(--g);color:#fff;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:10px}
header h1{flex:1;min-width:0;display:flex;white-space:nowrap}header .ttl{flex:0 0 auto}#farmHd{min-width:0;overflow:hidden;text-overflow:ellipsis}#farmHd:not(:empty)::before{content:'｜';opacity:.6;margin:0 2px}
#setBtn.on{background:#fff;color:var(--g)}
#setBtn{flex:0 0 auto;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.6);min-height:36px;padding:4px 10px;font-size:14px}
.menu{display:block;width:100%;text-align:left;margin:0 0 10px;padding:14px 16px}.menu b{display:block;font-size:17px}.menu span{display:block;font-size:13px;color:var(--mut);font-weight:400;margin-top:2px}
.sw{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:16px}.sw input{width:24px;height:24px;flex:0 0 auto}
input[type=checkbox]{accent-color:var(--g)}
header h1{margin:0;font-size:18px;font-weight:600}
header small{font-weight:400;opacity:.8;margin-left:6px;font-size:13px}
main{max-width:760px;margin:0 auto;padding:4px 14px 14px}
h2{font-size:17px;margin:18px 0 8px}
#app h2{display:flex;align-items:center;gap:8px;font-size:19px;color:var(--g);margin:16px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--g2)}
#app h2 .ic{flex:0 0 auto;width:30px;height:30px;border-radius:8px;background:var(--g);display:flex;align-items:center;justify-content:center}#app h2 .ic svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#app h2 .mut{margin-left:auto}
h3{font-size:15px;margin:14px 0 6px;color:var(--mut);font-weight:600}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
button,.btn{font:inherit;border:1px solid var(--g);background:#fff;color:var(--gt);border-radius:8px;padding:10px 14px;cursor:pointer;min-height:44px}
button.pri{background:var(--g);color:#fff;font-weight:600}
button.big{padding:16px 10px;font-size:17px;font-weight:600}
button.sm{min-height:36px;padding:6px 10px;font-size:14px}
button.danger{border-color:var(--red);color:var(--red)}
button.tab{border-color:var(--line);color:var(--ink);min-height:40px;padding:6px 4px;font-size:14px;flex:1 1 30%}
button.tab.on{background:var(--g2);border-color:var(--gt);color:var(--gt);font-weight:600}
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:4px}
.item{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 12px;margin:6px 0;min-height:0}
.item .t{font-weight:600}
.item .s{color:var(--mut);font-size:14px}
.tag{display:inline-block;font-size:12px;border-radius:99px;padding:1px 9px;margin-right:6px;background:var(--g2);color:var(--gt);font-weight:600}
.tag.f{background:#eef0fb;color:#3a4a9a}.tag.w{background:#eceff1;color:#37474f}.tag.h{background:#fdf0e0;color:#8a5200}
.warn{background:var(--warnbg);border:1px solid #f0cf9a;color:var(--warn);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14px}
.mut{color:var(--mut);font-size:14px}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 3px}
input,select,textarea{font:inherit;width:100%;padding:10px;border:1px solid #b9c3b9;border-radius:8px;background:#fff;color:var(--ink)}
input[type=checkbox]{width:22px;height:22px;margin:0 8px 0 0;flex:0 0 auto}
.chk{display:flex;align-items:center;padding:8px 0;font-size:16px;color:var(--ink);margin:0}
.new{margin-top:6px;font-size:14px}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center}
nav button{flex:1;max-width:160px;border:0;border-radius:0;color:var(--mut);font-size:13px;padding:10px 2px;min-height:56px}
nav button.on{color:var(--gt);font-weight:700;box-shadow:inset 0 3px 0 var(--g)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.modal[hidden]{display:none}
.sheet{background:#fff;width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px}
.sheet h2{margin-top:0}
.err{color:var(--red);font-size:14px;margin-top:8px}
.acts{display:flex;gap:8px;flex-wrap:wrap;position:sticky;bottom:0;background:#fff;margin:16px -16px 0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);z-index:2}
.acts .err{flex:1 1 100%;margin:0}
.sheet{padding-bottom:0!important}
.miss{outline:2px solid var(--red);outline-offset:2px;border-radius:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.chip{min-height:44px;padding:5px 10px;font-size:15px;border:1px solid #b9c3b9;color:var(--ink);background:#fff;border-radius:10px;text-align:left;line-height:1.25;flex:0 1 auto}
.chip small{display:block;color:var(--mut);font-size:12px}
.chip.on{background:var(--g);border-color:var(--g);color:#fff;font-weight:600}
.chip.on small{color:#d6efe6}
.pkbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pkbar input[type=search]{flex:1 1 160px;padding:8px}
.sw{display:flex;align-items:center;gap:6px;margin:0;color:var(--ink);font-size:15px;flex:0 0 auto}
.sw input{width:22px;height:22px;margin:0}
.pkmore{display:block;width:100%;min-height:40px;margin:2px 0 4px;padding:6px 10px;font-size:14px;border:0;border-top:1px dashed var(--line);border-radius:0;background:none;color:var(--gt);text-align:center}
.fd{margin:0 -10px;padding:0 10px 10px;border-radius:10px;border-left:4px solid transparent}
.fd.req{background:var(--g2);border-left-color:var(--g);margin-top:8px}
.fd.req+.fd.req{margin-top:4px}
.fd>label:first-child,.fd>.frow>.fc>label:first-child,.fd>#pkwrap>label:first-child{margin-top:6px}
.legend{font-size:13px;color:var(--mut);margin:-6px 0 4px}
.legend i{display:inline-block;width:14px;height:14px;vertical-align:-2px;background:var(--g2);border-left:4px solid var(--g);border-radius:3px;margin-right:4px}
.mk{font-size:13px;font-weight:600;margin-left:8px;white-space:nowrap}.mk.y{color:var(--gt)}.mk.n{color:var(--red)}
.rep h3{margin:16px 0 4px;color:var(--ink);font-size:16px}.rmeta{font-size:13px;color:var(--mut);margin:0 0 8px}
.tw{overflow-x:auto}.rt{font-size:13px;white-space:nowrap}.rt th{background:var(--g2)}.rt td,.rt th{border:1px solid var(--line);padding:4px 6px}
@page{size:A4 landscape;margin:10mm}
@media print{body{background:#fff;padding:0}header,nav,.noprint,#toast{display:none!important}main{max-width:none;padding:0}
  .tw{overflow:visible}.rt{font-size:9pt;white-space:normal;width:100%}.rt thead{display:table-header-group}.rt tr{page-break-inside:avoid}.rep h3{margin-top:0}}
.std{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:8px 0 0;background:#fff;font-size:14px;line-height:1.45}
.std.ng{border-color:#e0a49c;background:#fff6f5}
.std ul{margin:4px 0 0;padding-left:18px}.std li{margin:2px 0}.std li.w{color:var(--red);font-weight:600}
.std .cr{color:var(--mut);font-size:13px}
.fsearch{background:#f4f6f4;border:1px solid var(--line);border-radius:10px;padding:2px 10px 10px;margin-top:6px}
.fres .item{padding:8px 10px;margin:4px 0}
.fnote{font-size:12px;color:var(--mut);line-height:1.5}div.fnote{margin-top:10px}.fnote p{margin:6px 0}
.okmsg button,.warn button{margin-top:6px}
.frow{display:flex;gap:8px;align-items:flex-end}
.frow>.fc{flex:1 1 0;min-width:0}
.frow>.fc.s{flex:0 0 92px}
.frow label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc{display:flex;gap:8px;align-items:center}.fc .tx{flex:1;min-width:0}.fc .d{font-weight:600;margin-right:8px;color:var(--g)}.fc .d.late{color:var(--warn)}.fc .sm{flex:0 0 auto}
.cmp td,.cmp th{text-align:left}.cmp2{font-size:13px;width:100%;table-layout:fixed}.cmp2 td{vertical-align:top;border:1px solid var(--line);padding:4px 6px;word-break:break-all}.cmp2 th{background:var(--g2);padding:4px}
.btnlink{display:block;text-align:center;padding:12px;border:1px solid var(--line);border-radius:10px;color:var(--g);text-decoration:none;background:#fff}
.wbtn{display:block;margin-top:8px;background:#fff;color:var(--warn);border-color:#e3b46a}
.okmsg{background:var(--g2);border:1px solid #9fcdbd;color:#00513e;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14px}
.acts .pri{flex:2}
#toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#1f2a22;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:90%}
#toast[hidden]{display:none}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
td.n{text-align:right}
label.btn{display:inline-flex;align-items:center;justify-content:center;color:var(--gt);font-size:16px;margin:0;flex:1 1 140px}
.ph{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0 8px}
.ph .p{position:relative;width:84px;height:84px}
.ph .pv{padding:0;border:0;width:100%;height:100%;min-height:0;background:none}
.ph img,.th img{width:100%;height:100%;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
.ph .x{position:absolute;top:-8px;right:-8px;width:28px;height:28px;min-height:0;padding:0;border-radius:50%;background:#fff;color:var(--red);border-color:var(--red);font-size:16px;line-height:1}
.ri{display:flex;gap:8px;align-items:center}.ri>.tx{flex:1;min-width:0}.ri .d{font-weight:600;margin-right:6px}.ri .pl{color:var(--mut);font-size:14px}
.ri .ph2{display:flex;gap:4px;flex:0 0 auto;align-items:center}.ri .ph2 img{width:44px;height:44px;object-fit:cover;border-radius:6px;display:block}.ri .ph2 .n{font-size:12px;color:var(--mut)}
.th{display:flex;gap:6px;margin-top:6px;align-items:center}
.th span{width:56px;height:56px;display:block}
#viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:30;display:flex;align-items:center;justify-content:center;padding:8px}
#viewer[hidden]{display:none}
#viewer img{max-width:100%;max-height:100%}
</style>
</head>
<body>
<header><h1><span class="ttl">栽培ノート</span><span id="farmHd"></span></h1><button id="setBtn" data-act="settings" aria-label="設定">⚙ 設定</button></header>
<main id="app"></main>
<nav id="nav"></nav>
<div id="modal" class="modal" hidden></div>
<div id="toast" hidden></div>
<div id="viewer" hidden data-act="closeViewer"></div>
<script src="crop-match.js"></script>
<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const COLS=['fields','crops','plantings','tasks','pesticides','fertilizers','machines','workers','shipTo','records','stock'];
const emptyDb=()=>{const d={app:'seisan-kiroku',version:1,meta:{farmName:'',lastExport:'',last:{}}};COLS.forEach(c=>d[c]=[]);return d};
let db=emptyDb(),storeMode='mem',view='home',sub={master:'fields',type:'',planting:''};

/* ---------- 保存 ---------- */
const KEY='seisan-kiroku-db';
let _idb=null;
function idb(){if(_idb)return Promise.resolve(_idb);return new Promise((res,rej)=>{let done=false;setTimeout(()=>{if(!done)rej(new Error('timeout'))},3000);
  const r=indexedDB.open('seisan-kiroku',2);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos')};
  r.onsuccess=()=>{done=true;_idb=r.result;_idb.onversionchange=()=>{_idb.close();_idb=null};res(_idb)};r.onerror=()=>{done=true;rej(r.error)}})}
async function idbGet(){const d=await idb();return new Promise((res,rej)=>{const q=d.transaction('kv').objectStore('kv').get(KEY);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function idbSet(v){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,KEY);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
/* 写真：本体はIndexedDBの photos に1枚ずつ保存。一覧用の縮小画像は起動時に読み込む */
const thumbs={},memPhotos={};
async function photoPut(p){if(!p.thumb)p.thumb=p.data;thumbs[p.id]=p.thumb;
  if(storeMode!=='idb'){memPhotos[p.id]=p;return}
  const d=await idb();await new Promise((res,rej)=>{const t=d.transaction('photos','readwrite');t.objectStore('photos').put(p,p.id);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
async function photoGet(id){if(memPhotos[id])return memPhotos[id];if(storeMode!=='idb')return null;
  const d=await idb();return new Promise((res,rej)=>{const q=d.transaction('photos').objectStore('photos').get(id);q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error)})}
async function loadThumbs(){const d=await idb();await new Promise(res=>{const q=d.transaction('photos').objectStore('photos').openCursor();
  q.onsuccess=()=>{const c=q.result;if(c){thumbs[c.key]=c.value.thumb||c.value.data;c.continue()}else res()};q.onerror=()=>res()})}
function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);res(i)};i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};i.src=u})}
function scaleImg(img,max,q){const w=img.naturalWidth,h=img.naturalHeight,r=Math.min(1,max/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*r));c.height=Math.max(1,Math.round(h*r));
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)}
async function makePhoto(file){const img=await loadImg(file);return{id:uid(),data:scaleImg(img,1600,.75),thumb:scaleImg(img,240,.6),createdAt:new Date().toISOString()}}
const usedPhotoIds=()=>[...new Set(live('records').flatMap(r=>r.photoIds||[]))];
function norm(v){const d=emptyDb();Object.assign(d.meta,v.meta||{});d.meta.last=d.meta.last||{};COLS.forEach(c=>{if(Array.isArray(v[c]))d[c]=v[c]});return d}
function seedSow(){if(db.meta.seededSow)return;db.meta.seededSow=1;
  [['播種','播種'],['定植','定植']].forEach(([n,k])=>{const ex=live('tasks').find(x=>x.name===n);if(ex){if(!ex.kind){ex.kind=k;ex.updatedAt=new Date().toISOString()}}else upsert('tasks',{name:n,kind:k})})}
function seedTasks(){if(db.meta.seededTasks)return;db.meta.seededTasks=1;
  if(!live('tasks').length)['耕起','畝立て','かん水','除草','草刈り','誘引','摘葉','摘果','片付け'].forEach(n=>upsert('tasks',{name:n}))}
async function load(){
  try{const v=await idbGet();storeMode='idb';if(v)db=norm(v);try{await loadThumbs()}catch(e){}return}catch(e){}
  try{const v=localStorage.getItem(KEY);storeMode='ls';if(v)db=norm(JSON.parse(v));return}catch(e){}
  storeMode='mem';
}
async function save(){dbVer++;
  try{if(storeMode==='idb')await idbSet(db);else if(storeMode==='ls')localStorage.setItem(KEY,JSON.stringify(db))}
  catch(e){toast('端末への保存に失敗しました。「データ」から書き出してください。')}
}
function askPersist(){try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}}

/* ---------- データ操作 ---------- */
const live=c=>db[c].filter(x=>!x.deleted);
const byId=(c,id)=>db[c].find(x=>x.id===id);
function upsert(c,o){o.updatedAt=new Date().toISOString();if(c==='records'&&db.meta.drive&&db.meta.drive.shared&&db.meta.drive.user)o.by=db.meta.drive.user;if(!o.id){o.id=uid();db[c].push(o)}else{const i=db[c].findIndex(x=>x.id===o.id);if(i>=0)db[c][i]=o;else db[c].push(o)}return o}
function removeItem(c,id){const x=byId(c,id);if(x){x.deleted=true;x.updatedAt=new Date().toISOString()}}
function plantingLabel(p){if(!p)return'（作付なし）';const f=byId('fields',p.fieldId),c=byId('crops',p.cropId);
  return (f?f.name:'圃場未設定')+'｜'+(c?c.name+(c.variety?'（'+c.variety+'）':''):'品目未設定')+(p.season?'｜'+p.season:'')}
function refLabel(c,x){if(!x)return'';if(c==='plantings')return plantingLabel(x);if(c==='crops')return x.name+(x.variety?'（'+x.variety+'）':'');return x.name||''}

/* ---------- 定義 ---------- */
const MASTERS={
  fields:{label:'圃場',defs:[{k:'name',l:'圃場名・番号',req:1},{k:'lot',l:'所在地（地番・施設番号など）'},{k:'area',l:'面積（a）',t:'number'},{k:'water',l:'取水・排水経路'},{k:'note',l:'周辺リスクなどのメモ',t:'textarea'}],
    sub:x=>[x.lot,x.area!==''&&x.area!=null?x.area+'a':''].filter(Boolean).join('　')},
  crops:{label:'品目',defs:[{k:'name',l:'品目名',req:1},{k:'variety',l:'品種（品種ごとに作付を分ける場合）'}],sub:()=>'',mark:x=>{const it=cmItemFor(x.name);return it&&!it.custom?'<span class="mk y">農薬の照合✔</span>':'<span class="mk n">農薬の照合✘</span>'}},
  plantings:{label:'作付',defs:[{k:'fieldId',l:'圃場',t:'ref',ref:'fields',add:1,req:1},{k:'cropId',l:'品目',t:'ref',ref:'crops',add:1,req:1},
    {k:'season',l:'作期（例：2026年 春作）'},{k:'varietyNote',l:'作付メモ（品種など）'},{k:'type',l:'栽培区分（例：慣行、特別栽培）'},{k:'area',l:'作付面積（a）',t:'number'},
    {k:'start',l:'開始日',t:'date'},{k:'harvestPlan',l:'収穫予定時期'},{k:'done',l:'この作付は終了した',t:'check'}],
    sub:x=>[x.varietyNote?'メモ：'+x.varietyNote:'',x.type,x.area!==''&&x.area!=null?x.area+'a':'',x.done?'終了':''].filter(Boolean).join('　')},
  tasks:{label:'作業',defs:[{k:'name',l:'作業名（例：耕起、かん水、誘引）',req:1},{k:'kind',l:'記録の種類（播種・定植を選ぶと、種苗の記録欄が出ます）',t:'select',opts:['','播種','定植']},{k:'note',l:'メモ',t:'textarea'}],sub:x=>[x.kind?x.kind+'の記録':'',x.note].filter(Boolean).join('　')},
  pesticides:{label:'農薬',defs:[{k:'_famic',t:'famic'},{k:'name',l:'農薬の名称',req:1},{k:'regNo',l:'登録番号'},{k:'ingredient',l:'有効成分'},{k:'note',l:'メモ（使用基準など）',t:'textarea'}],
    sub:x=>[x.regNo?'登録番号 '+x.regNo:'',x.ingredient,x.famic?'登録情報 '+x.famic.asOf+'反映':'登録情報なし'].filter(Boolean).join('　')},
  fertilizers:{label:'肥料等',defs:[{k:'name',l:'名称',req:1},{k:'kind',l:'種別',t:'select',opts:['肥料','堆肥','土壌改良資材']},{k:'n',l:'窒素成分（%）',t:'number'}],
    sub:x=>[x.kind,x.n!==''&&x.n!=null?'N '+x.n+'%':''].filter(Boolean).join('　')},

const PK_SHOW=5;

function collect(){

function recordForm(type,rec,dup){
  const isNew=!rec||dup,last=db.meta.last||{};
  const base=rec?Object.assign({},rec):{date:today(),workerId:last.workerId||'',machineId:last.machineId||'',unit:(last.unit||{})[type]||'',usedUnit:last.usedUnit||''};
  if(dup){delete base.id;base.date=today();base.plantingIds=[rec.plantingId];base.photoIds=[]}

  const np=RT[type].noPlanting;
  if(type==='ship'&&isNew&&!rec&&last.shipToId)base.itemId=last.shipToId;
  const defs=[{k:'date',l:'日付',t:'date',req:1}].concat(np?[]:[
    isNew?{k:'plantingIds',l:'作付',t:'multi',ref:'plantings',req:1}:{k:'plantingId',l:'作付',t:'ref',ref:'plantings',active:1,req:1}])
    .concat(RT[type].defs,[{k:'workerId',l:'作業者',t:'ref',ref:'workers',add:1},{k:'memo',l:'メモ',t:'textarea'},{k:'photoIds',l:'写真',t:'photos'}]);
  openForm({title:RT[type].label+(isNew?'を記録':'の修正'),defs,values:base,submitLabel:'記録する',type,recId:isNew?null:rec.id,useSel:base.use||'',
    onSave:(v,c)=>{
      if(type==='pesticide')v.use=c.useSel||'';
      const ids=np?[null]:isNew?v.plantingIds:[v.plantingId];delete v.plantingIds;
      const sk=ids.length>1?RT[type].defs.filter(d=>d.split&&typeof v[d.k]==='number'&&!isNaN(v[d.k])):[];
      const shares=sk.length?splitShares(ids):null;
      ids.forEach((pid,i)=>{const r=Object.assign({},isNew?{}:rec,v,{type,plantingId:pid});
        if(shares){r.splitOf={n:ids.length};sk.forEach(d=>{r.splitOf[d.k]=v[d.k];r[d.k]=Math.round(v[d.k]*shares[i]*1000)/1000})}
        if(type==='harvest'){const p=byId('plantings',pid),f=p&&byId('fields',p.fieldId);r.lot=(v.date||'').replace(/-/g,'')+'-'+(f?f.name:'')}
        if(type==='dry'&&!r.dryLot){const base=r.lot||(v.date||'').replace(/-/g,'');const n=live('records').filter(x=>x.type==='dry'&&x.dryLot&&x.dryLot.startsWith(base+'-調')).length+1;r.dryLot=base+'-調'+n}
        upsert('records',r);

const UNIT_BASE={g:['重さ',1],kg:['重さ',1000],t:['重さ',1e6],mL:['容量',1],L:['容量',1000]};
const toBase=(q,u)=>{const b=UNIT_BASE[u];return b?[b[0],q*b[1]]:[u||'',q]};

function stockOf(col,id){
  const ev=[];
  live('stock').filter(x=>x.col===col&&x.itemId===id).forEach(x=>ev.push({date:x.date,kind:x.kind,qty:x.qty,unit:x.unit,src:x,o:x.kind==='in'?0:2}));
  live('records').filter(r=>r.itemId===id&&((col==='pesticides'&&r.type==='pesticide'&&typeof r.usedQty==='number')||(col==='fertilizers'&&r.type==='fertilizer'&&typeof r.amount==='number')))
    .forEach(r=>ev.push({date:r.date,kind:'use',qty:col==='pesticides'?r.usedQty:r.amount,unit:col==='pesticides'?r.usedUnit:r.unit,rec:r,o:1}));
  ev.sort((a,b)=>(a.date||'').localeCompare(b.date||'')||a.o-b.o);
  const unitSrc=[...ev].reverse().find(e=>e.kind!=='use')||[...ev].reverse()[0];
  const unit=unitSrc?unitSrc.unit:'';const [dim,fac]=toBase(1,unit);
  let run=0,inSum=0,useSum=0,skipped=0,lastCount=null;const hist=[];
  ev.forEach(e=>{const [d,b]=toBase(e.qty,e.unit);if(d!==dim){skipped++;hist.push(Object.assign(e,{skip:1}));return}

    hist.push(Object.assign(e,{after:r3(run/fac)}))});
  return{unit,qty:r3(run/fac),inSum:r3(inSum/fac),useSum:r3(useSum/fac),skipped,lastCount,hist,has:ev.length>0}}

function dedupTasks(){const now=new Date().toISOString(),by={};let n=0;

    db.records.forEach(r=>{if(r.type==='work'&&r.itemId===t.id){r.itemId=keep.id;r.updatedAt=now}});

  stockMat:e=>{sub.stockMat=sub.stockMat===e.dataset.k?'':e.dataset.k;render()},
  newStock:e=>stockForm(e.dataset.kind),
  editStock:e=>{const x=byId('stock',e.dataset.id);if(x)stockForm(x.kind,x)},
  exportStockCsv:()=>{download('栽培ノート在庫_'+stamp()+'.csv',stockCsv(),'text/csv');toast('在庫のCSVを書き出しました')},
  newMaster:()=>{const k=sub.master;openForm({title:MASTERS[k].label+'を追加',defs:MASTERS[k].defs,values:{},onSave:(v,c)=>{if(c.famic)v.famic=c.famic;upsert(k,v)}})},
  editMaster:e=>{const k=sub.master,x=byId(k,e.dataset.id);openForm({title:MASTERS[k].label+'の修正',defs:MASTERS[k].defs,values:x,onSave:(v,c)=>{if(c.famic)v.famic=c.famic;upsert(k,Object.assign({},x,v))},onDelete:()=>removeItem(k,x.id)})},
  closeForm:e=>{if(formDirty()&&e.dataset.sure!=='1'){backWarn();return}closeForm()},
  fpick:async e=>{const ctx=formCtx,no=e.dataset.no;$('#fres').innerHTML='<p class="mut">読み込み中…</p>';
    try{const d=await famicReg(no);if(formCtx!==ctx)return;if(!d){$('#fres').innerHTML='<p class="mut">この登録番号の情報がありません。</p>';return}
      ctx.famic=d;const f=$('#frm');f.elements.name.value=d.name;f.elements.regNo.value=d.regNo;f.elements.ingredient.value=d.ing.map(x=>x[0]).join('、');
      $('#fres').innerHTML='';const q=document.querySelector('[data-fq]');if(q)q.value='';$('#fsel').innerHTML=famicSel()}
    catch(err){$('#fres').innerHTML=`<div class="warn">${famicFail}</div>`}},
  fcheck:async e=>{const ctx=formCtx,out=$('#fchk');out.textContent='　確認中…';
    try{const d=await famicReg(ctx.famic.regNo);if(formCtx!==ctx)return;
      if(!d){out.innerHTML='<br><b style="color:var(--red)">現在の登録情報に見つかりません（失効の可能性があります）。ラベルと農林水産省の情報で確認してください。</b>';return}
      if(JSON.stringify([d.rows,d.ing])===JSON.stringify([ctx.famic.rows,ctx.famic.ing])){out.textContent=`　変更はありません（${d.asOf}反映）`;ctx.famic.asOf=d.asOf;return}
      ctx.famic=d;$('#fsel').innerHTML=famicSel();$('#fchk').innerHTML='<br><b>登録内容が変わっていたため、最新の内容に置き換えました。「保存」で台帳に反映します。</b>'}
    catch(err){out.innerHTML='<br>'+famicFail}},
  checkAll:async e=>{e.textContent='確認中…';await famicCheckAll()},
  pk:e=>{const c=formCtx,id=e.dataset.id;c.pk=c.pk.includes(id)?c.pk.filter(x=>x!==id):c.pk.concat(id);
    const w=$('#pkwrap');if(w)w.classList.remove('miss');pkRender();updChecks()},
  pkAll:()=>{formCtx.pkAll=true;pkRender()},
  pkLess:()=>{formCtx.pkAll=false;pkRender()},
  rmPhoto:e=>{formCtx.photoIds=formCtx.photoIds.filter(x=>x!==e.dataset.id);$('#phbox').innerHTML=phBox()},
  viewPhoto:async e=>{const id=e.dataset.id;const p=(formCtx&&formCtx.newPhotos[id])||await photoGet(id).catch(()=>null);
    const v=$('#viewer');v.innerHTML=p?`<img src="${p.data}" alt="写真">`:'<p style="color:#fff">写真を読み込めません</p>';v.hidden=false},
  closeViewer:()=>{const v=$('#viewer');v.hidden=true;v.innerHTML=''},
  delForm:async e=>{if(e.dataset.sure!=='1'){e.dataset.sure='1';e.textContent='もう一度押すと削除';return}
    formCtx.onDelete();closeForm();await save();render();toast('削除しました')},
  exportJson:async()=>{const w=$('#withPhotos');const t=await exportText(!w||w.checked);await save();download('栽培ノート_'+stamp()+'.json',t,'application/json');render();toast('データファイルを書き出しました')},
  shareJson:async e=>{
    /* 共有はボタンを押した直後でないと許可されないため、ファイルを先に用意し、2回目の押下で共有する */
    const sp=$('#sharePhotos'),wp=!!(sp&&sp.checked);
    const fresh=shareFile&&Date.now()-shareFile.at<120000&&shareFile.ver===dbVer&&shareFile.wp===wp;
    if(!fresh){e.textContent='準備中…';const t=await exportText(wp);
      shareFile={f:new File([t],'栽培ノート_'+stamp()+'.txt',{type:'text/plain'}),at:Date.now(),ver:dbVer,wp};}
    const f=shareFile.f;
    if(!(navigator.canShare&&navigator.canShare({files:[f]}))){toast('この端末ではファイルの共有に対応していません。「書き出す」を使ってください。');render();return}
    try{await navigator.share({files:[f],title:'栽培ノートのデータ'});shareFile=null;await save();render();toast('共有しました')}
    catch(err){if(err&&err.name==='AbortError'){render();return}
      if(err&&err.name==='NotAllowedError'){e.textContent='もう一度押して共有';return}
      toast('共有できませんでした（'+(err&&err.name||'エラー')+'）。「書き出す」を使ってください。');render()}},
  exportCsv:()=>{download('栽培ノート一覧_'+stamp()+'.csv',csvText(),'text/csv');toast('CSVを書き出しました')}
};
document.addEventListener('input',e=>{const el=e.target;if(!el.hasAttribute)return;
  if(el.hasAttribute('data-pkq')&&formCtx){formCtx.pkQ=el.value.trim();pkRender();return}
  if(el.hasAttribute('data-fq')){clearTimeout(fqTimer);const q=el.value;fqTimer=setTimeout(()=>famicSearch(q),200);return}
  if(el.hasAttribute('data-use')&&formCtx){formCtx.useSel=el.value;updChecks();return}
  if(formCtx&&el.closest&&el.closest('#frm'))updChecks()});
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el&&ACT[el.dataset.act])ACT[el.dataset.act](el)});
document.addEventListener('submit',async e=>{if(e.target.id!=='frm')return;e.preventDefault();const v=collect();if(!v)return;
  const ctx=formCtx;for(const id of (v.photoIds||[])){const p=ctx.newPhotos[id];if(p){try{await photoPut(p)}catch(err){toast('写真の保存に失敗しました')}}}
  ctx.onSave(v,ctx);closeForm();askPersist();await save();render()});
document.addEventListener('change',async e=>{const el=e.target;
  if(el.hasAttribute&&el.hasAttribute('data-photo')){const ctx=formCtx;if(!ctx)return;
    for(const f of [...el.files]){try{const p=await makePhoto(f);ctx.newPhotos[p.id]=p;ctx.photoIds.push(p.id)}catch(err){toast('この画像は読み込めません')}}
    el.value='';if(formCtx===ctx)$('#phbox').innerHTML=phBox();return}
  if(el.id==='imp'&&el.files[0]){const file=el.files[0];let inc;
    try{const tx=(await file.text()).replace(/^\ufeff/,'');inc=JSON.parse(tx);if(!inc||inc.app!=='seisan-kiroku')throw 0}
    catch(err){importMsg={ng:1,text:'「'+file.name+'」は栽培ノートのデータファイルではないため、読み込めませんでした。'};render();return}
    try{const before=live('records').length,r=merge(inc);let pa=0,pf=0;
      if(Array.isArray(inc.photos))for(const p of inc.photos){if(p&&p.id&&p.data&&!thumbs[p.id]){try{await photoPut(p);pa++}catch(err){pf++}}}
      await save();const fr=(inc.records||[]).filter(x=>x&&!x.deleted).length,after=live('records').length;
      importMsg={text:`「${file.name}」を読み込みました。ファイル内の記録${fr}件のうち、新しく加わった記録は${after-before}件です（台帳なども含めた追加${r.add}件、更新${r.upd}件、写真${pa}枚）。`
        +(r.add+r.upd+pa===0?'すべてこの端末にすでにある内容でした。同じ端末で書き出したファイルを読み込むと、このようになります。':'')+(pf?`写真${pf}枚は保存できませんでした。`:'')};
      render();window.scrollTo(0,0)}
    catch(err){importMsg={ng:1,text:'読み込み中にエラーが起きました（'+(err&&err.message||err)+'）。'};render()}
    el.value='';return}
  if(el.hasAttribute&&el.hasAttribute('data-use')&&formCtx){formCtx.useSel=el.value;updChecks();return}
  if(formCtx&&el.closest&&el.closest('#frm')){updChecks();return}
  if(el.dataset&&el.dataset.rep){sub.rep=Object.assign(repOpt(),{[el.dataset.rep]:el.value});render();return}
  const k=el.dataset&&el.dataset.chg;if(!k)return;
  if(k==='farm'){db.meta.farmName=el.value.trim();await save();$('#farmHd').textContent=db.meta.farmName;return}
  if(k==='prevId'){const p=byId('plantings',el.dataset.pid);if(p){p.prevId=el.value;upsert('plantings',p);await save();render()}return}
  if(k==='recOn'){db.meta.off=Object.assign({},db.meta.off,{[el.dataset.k]:!el.checked});await save();return}
  sub[k]=el.value;render()});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeForm()});
load().then(()=>{let ch=false;if(!db.meta.seededTasks||!db.meta.seededSow){seedTasks();seedSow();ch=true}if(dedupTasks())ch=true;if(ch)save();render()});
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
