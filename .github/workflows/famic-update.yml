# 農薬登録情報（FAMIC）を週1回取得し、変更があればコミットする
name: FAMICデータの更新
on:
  schedule:
    - cron: '17 19 * * 2'   # 毎週水曜 4:17（日本時間）
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 取得と変換
        run: python3 tools/famic_fetch.py
      - name: 変更があればコミット
        run: |
          git config user.name "famic-updater"
          git config user.email "actions@users.noreply.github.com"
          git add data/famic
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "農薬登録情報を更新（$(python3 -c 'import json;print(json.load(open("data/famic/meta.json"))["asOf"])')反映分）"
          git push
